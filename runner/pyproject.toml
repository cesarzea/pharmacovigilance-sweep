[project]
name = "pvsweep-runner"
version = "0.1.0"
description = "Pharmacovigilance Sweep: data staging, sweep runner and evaluation export"
requires-python = ">=3.13"
dependencies = [
    "duckdb==2.0.1",
    "openai==3.57.0",
    "anthropic==2.12.0",
    "azure-identity==1.27.0",
    "httpx==0.28.1",
    "jsonschema==4.25.1",
    "agent-framework==1.26.0",
    "agent-framework-foundry==1.16.2",
    "agent-framework-anthropic==1.0.0b261112",
    "snowflake-connector-python>=5.2.0",
    "cryptography>=45",
    "databricks-sql-connector==4.8.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.1", "ruff==0.15.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pvsweep_load*", "pvsweep_synth*", "pvsweep_runner*", "pvsweep_agent*"]

[tool.ruff]
line-length = 110
